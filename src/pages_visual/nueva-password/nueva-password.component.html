<div class="recovery-page">

  <div class="recovery-card">

    <!-- ICONO -->
    <div class="icon-area">
      <div class="mail-circle">
        <i class="bi bi-lock-fill"></i>
      </div>
    </div>

    <!-- TÍTULO -->
    <h2>Nueva contraseña</h2>
    <p class="subtitle">Ingresa tu nueva contraseña</p>

    <!-- INPUT -->
    <input
      type="password"
      class="form-control"
      placeholder="Nueva contraseña"
      [(ngModel)]="password"
    />

    <!-- BOTÓN -->
    <button class="btn-recovery" (click)="cambiarPassword()" [disabled]="loading">
      <span *ngIf="!loading">Cambiar contraseña</span>
      <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
    </button>

    <!-- LINK VOLVER -->
    <a routerLink="/login" class="back-link">Volver al login</a>

  </div>
</div>
